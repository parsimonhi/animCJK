<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Demo to show the radical
of a Chinese, Japanese or Korean character using animCJK svg files">
<link rel="stylesheet" href="_css/withSelector.css" type="text/css">
<link rel="stylesheet" href="_css/topBottom.css" type="text/css">
<style>
#a
{
	display:flex;
	justify-content:center;
	align-items:center;
	text-align:center;
	width:min(16rem,80vw);
	height:min(16rem,80vw);
	border:1px solid #ccc;
	margin:0.5rem 0;
	padding:0;
	resize:both;
	overflow:auto;
}
#a svg
{
	display:block;
	max-width:100%;
	max-height:100%;
}
pre
{
	border:1px solid #ccc;
	padding:0.125rem;
	white-space:pre-wrap;
}
[data-category="Kana"] {display:none;}
</style>
<title>AnimCJK Radical</title>
<link rel="icon" type="image/svg+xml" href="../animCJKIcon.svg">
</head>
<body id="top">
<header>
<h1>AnimCJK Radical</h1>
</header>
<main>
<nav class="link">
<a href="#bottom"><span>Bottom</span></a>
<a href="https://github.com/parsimonhi/animCJK"><span>Download</span></a>
<a href="./"><span>Sample selector</span></a>
<a href="../"><span>Home</span></a>
</nav>
<fieldset class="langSelector"></fieldset>
<fieldset class="dataSelector"></fieldset>
<figure id="a"></figure>
<p id="b" class="acjkDecomposition"></p>
<details>
<summary>SVG code</summary>
<pre class="codeTag"></pre>
</details>
<fieldset class="charListSelector"></fieldset>
<footer id="bottom">
<nav class="link">
<a href="#top"><span>Top</span></a>
<a href="./"><span>Sample selector</span></a>
<a href="../licenses/COPYING.txt"><span>Licenses</span></a>
<a href="../"><span>Home</span></a>
</nav>
</main>
</footer>
<script src="_js/setRadical.js"></script>
<script>
let dicos={ZhHans:null,Ja:null,Ko:null,ZhHant:null}; // set by selectorAcjk.js
function updateCodeTag()
{
	let e,s;
	e=document.getElementById("a");
	s=e.innerHTML;
	s=s.replace(/<style./,"<style"+">\n<![CDATA[");
	s=s.replace(/.\/style>/,"]]>\n<"+"/style>");
	s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
	document.querySelector('.codeTag').innerHTML=s;
}
function getLangAcjk()
{
	let e=document.querySelector('[name="lang"]:checked');
	return e?e.value:"Ja";
}
function cleanDataForOne(s)
{
	// keep only the first char
	// keep only chars from ⺀ (decimal unicode 11904)
	for (let c of s) if(c.codePointAt(0)>=11904) return c;
	return "";
}
function getLangIso()
{
	let e=document.querySelector('[name="lang"]:checked');
	return e?e.getAttribute("data-lang"):"ja";
}
function addLangSpan(s)
{
	let r,langIso=getLangIso();
	r=s.replace(/(\p{sc=Han}+)/gu,"<span lang=\""+langIso+"\">$1</span>");
	return r;
}
function updateInfo(s)
{
	let d=new Date().getFullYear();
	s=s.replace(/AnimCJK [0-9-]+/,"AnimCJK 2016-"+d);
	return s;
}
function getOneFromDico(c,langLabel)
{
	if(dicos[langLabel])
		for(let e of dicos[langLabel])
			if(e["character"]==c) return e;
	return null;
}
function run(s,d,c,dir)
{
	let e=document.getElementById("a");
	if(s.match(/<svg[^>]+class="acjk"/))
	{
		s=updateInfo(s);
		s=s.replace(/<style[^@]+@/,"<style"+">\n@");
		s=s.replace(/}[^}]+\/style>/,"}\n<"+"/style>");
		e.innerHTML=s;
		let dd=document.querySelector('#b');
		dd.setAttribute("data-d",d);
		dd.innerHTML=addLangSpan(d);
		setRadical(1);
		updateCodeTag();
	}
	else
	{
		s=c+" not found in "+dir;
		e.innerHTML=s;
	}
	document.querySelector('[name="data"]').scrollIntoView();
}
function doIt(tried=0)
{
  	let e=document.querySelector('[name="data"]'),c=cleanDataForOne(e.value);
  	document.querySelector('#a').innerHTML="";
  	document.querySelector('#b').innerHTML="";
  	document.querySelector('.codeTag').innerHTML="";
	if(c)
	{
		let dec=c.codePointAt(0),lang=getLangAcjk();
		e.value=c=String.fromCodePoint(dec);
		let oneDicoLine=getOneFromDico(c,lang);
		if(oneDicoLine)
		{
			let special=oneDicoLine.acjks?1:0,dir='svgs'+lang+(special?'Special':'');
			let d=oneDicoLine.acjks?oneDicoLine.acjks:oneDicoLine.acjk?oneDicoLine.acjk:"";
			// do not try to display Kana since they don't have a radical
			fetch('../'+dir+'/'+dec+'.svg',{cache:"no-cache"})
			.then(r=>{if(!r.ok) throw r.statusText; return r.text();})
			.then(s=>run(s,d,c,dir))
			.catch(e=>run(e,d,c,dir));
		}
		else if(dicos[lang])
			document.getElementById("a").innerHTML=c+' not found'+' in dictionary'+lang+'.txt';
		else document.getElementById("a").innerHTML='Click on "Run" button';
	}
}
</script>
<script src="_js/selectorAcjk.js"></script>
</body>
</html>
