<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Display Heisig primitives and corresponding AnimCJK SVG">
<title>AnimCJK - Heisig primitives and AnimCJK SVG</title>
<link rel="stylesheet" href="_css/topBottom.css" type="text/css">
<style>
:root
{
	--len:min(0.5rem,2.5vw);
	--size:min(6.5rem,32.5vw);
}
* {max-width:100%;overflow-wrap:anywhere;}
body{font-family:sans-serif;margin:0;padding:var(--len);}
nav
{
	display:flex;
	flex-wrap:wrap;
	gap:var(--len);
}
a
{
	color:#000;
}
table,tr,th,td,caption{box-sizing:border-box;}
table
{
	margin:calc(2 * var(--len)) 0;
	padding:0;
	border-collapse:collapse;
}
table caption
{
	text-align:left;
	padding:0;
	margin:0 0 calc(2 * var(--len)) 0;
}
td,th
{
	border:1px solid grey;
	text-align:center;
	padding:calc(0.25 * var(--len));
}
svg
{
	display:block;
	width:100%;
	height:auto;
	margin:auto;
	fill:crimson;
}
td.C,td.A
{
	font-size:var(--size);
	width:calc(var(--size) * 1.5);
}
td.C
{
	font-family:serif;
}
th.C,
td.C
{
	color:navy;
}
th.A
{
	color:crimson;
}
@media screen and (max-width: 40em)
{
	table
	{
		display:flex;
		flex-direction:column;
		gap:calc(2 * var(--len));
		border-collapse:initial;
		max-width:calc(3 * var(--size));
	}
	tr
	{
		display:grid;
		grid-template-columns:1fr 1fr;
	}
	th,td
	{
		display:flex;
		justify-content:center;
		align-items:center;
		padding:calc(0.25 * var(--len)) calc(0.125 * var(--len));
	}
	th:not(:last-of-type),td:not(:last-of-type)
	{
		border-bottom:0;
	}
	th.N,td.N,
	th.F,td.F
	{
		grid-column:1 / -1;
	}
	th.C,td.C
	{
		grid-column:1;
		width:100%;
		height:100%;
		border-right:0;
	}
	th.A,td.A
	{
		grid-column:2;
		width:100%;
	}
}
</style>
<link rel="icon" type="image/svg+xml" href="../animCJKIcon.svg">
</head>
<body id="top">
<header>
<h1>Heisig primitives and AnimCJK SVG</h1>
</header>
<main>
<nav class="link">
<a href="#bottom"><span>Bottom</span></a>
<a href="https://github.com/parsimonhi/animCJK"><span>Download</span></a>
<a href="./"><span>Sample selector</span></a>
<a href="../"><span>Home</span></a>
</nav>
</main>
<footer id="bottom">
<nav class="link">
<a href="#top"><span>Top</span></a>
<a href="./"><span>Sample selector</span></a>
<a href="../licenses/COPYING.txt"><span>Licenses</span></a>
<a href="../"><span>Home</span></a>
</nav>
</footer>
<script>
let n=0,nmax;
function addToMain(table)
{
	let main=document.querySelector('main');
	main.append(table);
}
function buildSvg(table,tr,td,s)
{
	let td2=document.createElement('td');
	td2.classList.add("A");
	td.before(td2);
	s=s.replace(/[<]!--[^£]*--[>]\n/,"");
	s=s.replace(/[<]style[^£]*style[>]\n/,"");
	s=s.replace(/[<]defs[^£]*defs[>]\n/,"");
	s=s.replace(/[<]path style[^>]*[>]\n/g,"");
	td2.innerHTML=s;
	n++;
	if(n>=nmax) addToMain(table); // all svg are loaded, ready to add table to main
}
function buildTd(table,tr,s)
{
	let td=document.createElement('td');
	td.innerHTML=s;
	if(s.match(/\p{sc=Han}/u))
	{
		td.setAttribute("lang","ja");
		td.classList.add("C");
	}
	else if(s.match(/[.]svg$/))
	{
		td.classList.add("F");
		td.innerHTML=td.innerHTML.replace(/\//,"<br>");
		let o={cache:"no-cache"};
		fetch("../"+s,o)
		.then(r=>r.text())
		.then(r=>buildSvg(table,tr,td,r));
	}
	else if(s=="") td.classList.add("C");
	else td.classList.add("N");
	tr.append(td);
}
function buildTh(table,tr,s,cls)
{
	let th=document.createElement('th');
	th.innerHTML=s;
	th.classList.add(cls);
	tr.append(th);
}
function buildTr(table,s)
{
	let tr=document.createElement('tr');
	let a=s.split(";");
	table.append(tr);
	a.forEach(b=>buildTd(table,tr,b.trim()));
}
function buildTable(s)
{
	let table=document.createElement('table');
	let tr=document.createElement('tr');
	let a=s.split("\n");
	a.shift();
	nmax=a.length;
	table.append(tr);
	buildTh(table,tr,"Heisig name","N");
	buildTh(table,tr,"Unicode char","C");
	buildTh(table,tr,"AnimCJK SVG","A");
	buildTh(table,tr,"AnimCJK SVG filename","F");
	a.forEach(b=>buildTr(table,b.trim()));
}
window.addEventListener("load",function()
{
	let o={cache:"no-cache"};
	fetch("_csv/heisigPrimitives.csv",o)
	.then(r=>r.text())
	.then(r=>buildTable(r.trim()));
});
</script>
</body>
</html>
