<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Demo to animate indefinitely
a Chinese, Japanese or Korean character using animCJK SVG files">
<link rel="stylesheet" href="_css/withSelector.css" type="text/css">
<link rel="stylesheet" href="_css/topBottom.css" type="text/css">
<style>
#a
{
	box-sizing:border-box;
	display:flex;
	justify-content:center;
	align-items:center;
	text-align:center;
	width:min(16rem,100%);
	aspect-ratio:1;
	border:1px solid #000;
	margin:var(--len) 0;
	padding:0;
	resize:both;
	overflow:auto;
}
#a svg
{
	display:block;
}
pre
{
	border:1px solid #000;
	padding:calc(var(--len) / 4);
	white-space:pre-wrap;
}
</style>
<title>AnimCJK Infinite</title>
<link rel="icon" type="image/svg+xml" href="../animCJKIcon.svg">
</head>
<body>
<header id="top">
<h1>AnimCJK Infinite</h1>
<nav class="link">
<a href="#bottom"><span>Bottom</span></a>
<a href="https://github.com/parsimonhi/animCJK"><span>Download</span></a>
<a href="./"><span>Sample selector</span></a>
<a href="../"><span>Home</span></a>
</nav>
</header>
<main>
<fieldset class="langSelector"></fieldset>
<fieldset class="dataSelector"></fieldset>
<figure id="a"></figure>
<details>
<summary>SVG code</summary>
<pre class="codeTag"></pre>
</details>
<fieldset class="charListSelector"></fieldset>
</main>
<footer id="bottom">
<nav class="link">
<a href="#top"><span>Top</span></a>
<a href="./"><span>Sample selector</span></a>
<a href="../licenses/COPYING.txt"><span>Licenses</span></a>
<a href="../"><span>Home</span></a>
</nav>
</footer>
<script>
function updateCodeTag()
{
	let e,s,z;
	z="<script"+">\n// <![CDATA[\n"+infinite+"\ninfinite();\n// ]]>\n</"+"script>";
	e=document.getElementById("a");
	s=e.innerHTML;
	s=s.replace(/<style./,"<style"+">\n<![CDATA[");
	s=s.replace(/.\/style>/,"]]>\n<"+"/style>");
	s=s.replace(/<\/svg>/,z+"\n</"+"svg>")
	s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
	document.querySelector('.codeTag').innerHTML=s;
}
function getLangAcjk()
{
	let e=document.querySelector('[name="lang"]:checked');
	return e?e.value:"ZhHans";
}
function cleanDataForOne(s)
{
	// keep only the first char
	// keep only chars from ⺀ (decimal unicode 11904)
	for (let c of s) if(c.codePointAt(0)>=11904) return c;
	return "";
}
function infinite()
{
	let e,s,n;
	e=document.querySelector('svg.acjk');
	s=e.innerHTML;
	n=(s.match(/--d:[0-9]+s/g)||[]).length;
	setInterval(()=>{e.replaceChildren();e.innerHTML=s;},(n+3)*1000);
}
function updateInfo(s)
{
	let d=new Date().getFullYear();
	s=s.replace(/AnimCJK [0-9-]+/,"AnimCJK 2016-"+d);
	return s;
}
function magicScroll()
{
	let e1=document.querySelector('[name="data"]').parentNode;
	let t1=e1.getBoundingClientRect().top;
	let e2=document.querySelector('[name="run"]');
	let t2=e2.getBoundingClientRect().top;
	let e3=document.getElementById("a");
	let t3=e3.getBoundingClientRect().bottom;
	let h=document.documentElement.clientHeight;
	if(h>(t3-t1)) e1.scrollIntoView();
	else if(h>(t3-t2)) e2.scrollIntoView();
	else e3.scrollIntoView();
}
function run(s,c,dir)
{
	let e=document.getElementById("a");
	if(s.match(/<svg[^>]+class="acjk"/))
	{
		s=updateInfo(s);
		s=s.replace(/<style[^@]+@/,"<style"+">\n@");
		s=s.replace(/}[^}]+\/style>/,"}\n<"+"/style>");
		e.innerHTML=s;
		infinite();
		updateCodeTag();
	}
	else
	{
		s=c+" not found in "+dir;
		e.innerHTML=s;
	}
	magicScroll();
}
function doIt()
{
  	let e=document.querySelector('[name="data"]'),c=cleanDataForOne(e.value);
  	document.getElementById("a").replaceChildren();
  	document.querySelector('.codeTag').replaceChildren();
	if(c)
	{
		let dec=c.codePointAt(0);
		e.value=c=String.fromCodePoint(dec);
		let lang=getLangAcjk(),dir='svgs'+lang;
		if((lang=="Ja")&&c.match(/^[ぁ-ヿ]$/u)) dir+="Kana";
		fetch('../'+dir+'/'+dec+'.svg',{cache:"no-cache"})
		.then(r=>{if(!r.ok) throw r.statusText; return r.text();})
		.then(r=>run(r,c,dir))
		.catch(e=>run(e,c,dir));
	}
}
</script>
<script src="_js/selectorAcjk.js"></script>
</body>
</html>
