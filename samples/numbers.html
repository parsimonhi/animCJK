<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Demo to add a number on each stroke of
a Chinese, Japanese or Korean character using animCJK svg files">
<link rel="stylesheet" href="_css/withSelector.css" type="text/css">
<link rel="stylesheet" href="_css/topBottom.css" type="text/css">
<style>
.specificSelector
{
	margin:0.5rem 0;
	padding:0;
	border:0;
}
#a
{
	display:flex;
	justify-content:center;
	align-items:center;
	text-align:center;
	width:min(16rem,80vw);
	height:min(16rem,80vw);
	border:1px solid #ccc;
	margin:0.5rem 0;
	padding:0;
	resize:both;
	overflow:auto;
}
#a svg
{
	display:block;
	max-width:100%;
	max-height:100%;
}
pre
{
	border:1px solid #ccc;
	padding:0.125rem;
	white-space:pre-wrap;
}
</style>
<title>AnimCJK Numbers</title>
<link rel="icon" type="image/svg+xml" href="../animCJKIcon.svg">
</head>
<body id="top">
<header>
<h1>AnimCJK Numbers</h1>
</header>
<main>
<nav class="link">
<a href="#bottom"><span>Bottom</span></a>
<a href="https://github.com/parsimonhi/animCJK"><span>Download</span></a>
<a href="./"><span>Sample selector</span></a>
<a href="../"><span>Home</span></a>
</nav>
<fieldset class="langSelector"></fieldset>
<fieldset class="dataSelector"></fieldset>
<fieldset class="specificSelector">
<label>Show numbers: <input type="checkbox" name="numbers"></label>
</fieldset>
<figure id="a"></figure>
<details>
<summary>SVG code</summary>
<pre class="codeTag"></pre>
</details>
<fieldset class="charListSelector"></fieldset>
</main>
<footer id="bottom">
<nav class="link">
<a href="#top"><span>Top</span></a>
<a href="./"><span>Sample selector</span></a>
<a href="../licenses/COPYING.txt"><span>Licenses</span></a>
<a href="../"><span>Home</span></a>
</nav>
</footer>
<script src="_js/setNumbersAcjk.js"></script>
<script>
function updateCodeTag()
{
	let e,s;
	e=document.getElementById("a");
	s=e.innerHTML;
	s=s.replace(/((<\/circle>)|(<\/text>))/g,"$1\n");
	s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
	document.querySelector('.codeTag').innerHTML=s;
}
function getLangAcjk()
{
	let e=document.querySelector('[name="lang"]:checked');
	return e?e.value:"Ja";
}
function cleanDataForOne(s)
{
	// keep only the first char
	// keep only chars from ⺀ (decimal unicode 11904)
	for (let c of s) if(c.codePointAt(0)>=11904) return c;
	return "";
}
function switchNumbers()
{
	setNumbers(document.querySelector('[name="numbers"]').checked);
	updateCodeTag();
}
function updateInfo(s)
{
	let d=new Date().getFullYear();
	s=s.replace(/AnimCJK [0-9-]+/,"AnimCJK 2016-"+d);
	return s;
}
function run(s,c,dir)
{
	let e=document.getElementById("a");
	if(s.match(/<svg[^>]+class="acjk"/))
	{
		s=updateInfo(s);
		s=s.replace(/<style[^£]+\/style>\s/,"");
		e.innerHTML=s;
		switchNumbers();
	} 
	else
	{
		s=c+" not found in "+dir;
		e.innerHTML=s;
	}
	document.querySelector('[name="data"]').scrollIntoView();
}
function doIt()
{
  	let e=document.querySelector('[name="data"]'),c=cleanDataForOne(e.value);
  	document.getElementById("a").innerHTML="";
  	document.querySelector('.codeTag').innerHTML="";
	if(c)
	{
		let dec=c.codePointAt(0);
		e.value=c=String.fromCodePoint(dec);
		let lang=getLangAcjk(),dir='svgs'+lang;
		if((lang=="Ja")&&c.match(/^[ぁ-ゟァ-ヿ]$/u)) dir+="Kana";
		fetch('../'+dir+'/'+dec+'.svg',{cache:"no-cache"})
		.then(r=>{if(!r.ok) throw r.statusText; return r.text();})
		.then(r=>run(r,c,dir))
		.catch(e=>run(e,c,dir));
	}
}
window.addEventListener("load",function(){
	let e=document.querySelector('[name="numbers"]');
	e.checked=true;
	e.addEventListener("click",switchNumbers);
});
</script>
<script src="_js/selectorAcjk.js"></script>
</body>
</html>
