<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Display the 214 Chinese radicals using AnimCJK SVG">
<title>AnimCJK - The 214 radicals</title>
<link rel="stylesheet" href="_css/topBottom.css" type="text/css">
<style>
:root
{
	--len:min(0.5rem,2.5vw);
	--size:min(6.5rem,80vw);
	--focus-color:#07f;
}
* {max-width:100%;overflow-wrap:anywhere;}
:focus-visible
{
	outline:2px solid var(--focus-color);
	outline-offset:1px;
}
body{font-family:sans-serif;margin:0;padding:var(--len);}
nav
{
	display:flex;
	flex-wrap:wrap;
	gap:var(--len);
}
a
{
	color:#000;
	display:inline-block;
	margin:0 var(--len) var(--len) 0;
	padding:0;
}
table,tr,th,td,caption{box-sizing:border-box;}
table
{
	margin:calc(2 * var(--len)) 0;
	padding:0;
	border-collapse:collapse;
}
table caption
{
	text-align:left;
	padding:0;
	margin:0 0 calc(2 * var(--len)) 0;
}
td,th
{
	border:1px solid grey;
	text-align:center;
	padding:calc(0.25 * var(--len));
}
svg
{
	display:block;
	width:100%;
	max-width:var(--size);
	height:auto;
	margin:auto;
	fill:crimson;
}
th.N, td.N
{
	width:3rem;
}
th.C, td.C
{
	color:navy;
}
td.C
{
	font-size:var(--size);
}
th.A
{
	color:crimson;
}
th.M, td.M, th.C, td.C, th.A, td.A
{
	width:calc(var(--size) * 1.5);
}
@media screen and (max-width: 35em)
{
	.N,.C {display:none;}
}
@media screen and (max-width: 17.5rem)
{
	table,
	table caption{display:block;}
	tr{display:flex;flex-direction:column;margin-bottom:var(--len);min-width:100%;}
	th.M, td.M, th.A, td.A {width:100%;}
	th,td{padding:calc(0.25 * var(--len)) 0;}
	th:not(:last-of-type),td:not(:last-of-type){border-bottom:0;}
}
</style>
<link rel="icon" type="image/svg+xml" href="../animCJKIcon.svg">
</head>
<body id="top">
<header>
<h1>The 214 radicals</h1>
</header>
<main>
<nav class="link">
<a href="#bottom"><span>Bottom</span></a>
<a href="https://github.com/parsimonhi/animCJK"><span>Download</span></a>
<a href="./"><span>Sample selector</span></a>
<a href="../"><span>Home</span></a>
</nav>
<p>zh-Hans version</p>
</main>
<footer id="bottom">
<nav class="link">
<a href="#top"><span>Top</span></a>
<a href="./"><span>Sample selector</span></a>
<a href="../licenses/COPYING.txt"><span>Licenses</span></a>
<a href="../"><span>Home</span></a>
</nav>
</footer>
<script>
function addToMain(table)
{
	let main=document.querySelector('main');
	main.append(table);
}
function buildSvg(table,tr,td,s,nmax)
{
	s=s.replace(/[<]!--[^£]*--[>]\n/,"");
	s=s.replace(/[<]style[^£]*style[>]\n/,"");
	s=s.replace(/[<]defs[^£]*defs[>]\n/,"");
	s=s.replace(/[<]path style[^>]*[>]\n/g,"");
	td.innerHTML=s;
}
function buildTd(table,tr,s)
{
	let td=document.createElement('td');
	tr.append(td);
	if(s.match(/[.]svg$/))
	{
		td.classList.add("A");
		let o={cache:"no-cache"};
		fetch("../"+s,o)
		.then(r=>r.text())
		.then(r=>buildSvg(table,tr,td,r));
	}
	else
	{
		td.textContent=s;
		if(s.match(/^[0-9]+$/)) td.classList.add("N");
		else if(s.match(/^\p{sc=Han}$/u)) {td.classList.add("C");td.setAttribute("lang","zh-Hans");}
		else td.classList.add("M");
	}
}
function buildTh(table,tr,s,cls)
{
	let th=document.createElement('th');
	th.innerHTML=s;
	th.classList.add(cls);
	tr.append(th);
}
function buildTr(table,s)
{
	let tr=document.createElement('tr');
	let a=s.split(";");
	table.append(tr);
	a.forEach(b=>buildTd(table,tr,b.trim()));
}
function computeNumOfStrokes(s)
{
	s=s.replace(/[^0-9]+/gu," ").trim();
	let a=s.split(" ");
	let n=0;
	for(k=0;k<a.length;k++) n-=(-a[k]);
	return n;
}
function buildOneTable(a)
{
	let table=document.createElement('table');
	let caption=document.createElement('caption');
	let tr=document.createElement('tr');
	caption.innerText=a[0].ns+" stroke"+((a[0].ns>1)?"s":"");
	table.append(caption);
	table.append(tr);
	buildTh(table,tr,"N°","N");
	buildTh(table,tr,"Meaning","M");
	buildTh(table,tr,"Character","C");
	buildTh(table,tr,"AnimCJK SVG","A");
	a.forEach(b=>buildTr(table,b.csv));
	addToMain(table);
}
function buildTables(s)
{
	let a=s.split("\n");
	a.shift();
	let r=[];
	let n=0;
	a.forEach(b=>
	{
		n++;
		let ns=b.replace(/^.*;([0-9]+)$/u,"$1");
		let e={ns:ns,csv:n+";"+b.replace(/^(.*);[0-9]+$/u,"$1")};
		if(!r[ns]) r[ns]=[];
		r[ns].push(e);
	});
	r.forEach(e=>{if(e){buildOneTable(e);}});
}
window.addEventListener("load",function()
{
	let o={cache:"no-cache"};
	fetch("_csv/radicalsZhHans.csv",o)
	.then(r=>r.text())
	.then(r=>buildTables(r.trim()));
});
</script>
</body>
</html>
